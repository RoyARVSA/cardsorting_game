<script id="game-core">
'use strict';
const Core=(()=>{
 const VERSION='daily-sort-v3', ANALYSIS='conservative-v1';
 const DURATION=180000,SCORING={correct:100,error:-40,timeout:0,unfinished:0};
 const scoreForResult=result=>SCORING[result]||0;
 const NAMES=['顏色','圖案','數量','框線'];
 const ERROR_NAMES={single_unexcluded_error:'新線索（單一特徵）',single_repeated_error:'重複已排除特徵',ambiguous_error:'新線索（多個特徵）',all_excluded_error:'符合特徵皆已排除',no_match_error:'沒有特徵相符'};
 function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0;}
 function random(seed){let a=hash(seed);return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t^=t+Math.imul(t^(t>>>7),61|t);return((t^(t>>>14))>>>0)/4294967296;};}
 function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
 function dateKey(time=new Date()){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(time);return ['year','month','day'].map(k=>p.find(x=>x.type===k).value).join('-');}
 function features(id){return [id&3,(id>>>2)&3,(id>>>4)&3,(id>>>6)&3];}
 function matched(card,ref){const m=[];for(let d=0;d<4;d++)if(card[d]===ref[d])m.push(d);return m;}
 function positions(card,refs){return card.map((v,d)=>refs.findIndex(r=>r[d]===v));}
 function makeChallenge(date,mode='fixed'){
  mode=mode==='moving'?'moving':'fixed';
  const key=date+'|'+VERSION,rng=random(key+'|schedule');
  const rr=random(key+'|refs'),cols=Array.from({length:4},()=>shuffle([0,1,2,3],rr));
  const refs=Array.from({length:4},(_,i)=>cols.map(col=>col[i]));
  let rules;do{rules=shuffle([0,0,1,1,2,2,3,3],rng);}while(rules.some((r,i)=>(i>0&&r===rules[i-1])||(i>1&&r===rules[i-2])));
  const lengths=Array.from({length:4},()=>20000+Math.floor(rng()*11)*500),seen=new Set();
  const durations=rules.map(r=>{if(seen.has(r))return 45000-lengths[r];seen.add(r);return lengths[r];});
  let sum=0;const boundaries=durations.map(d=>sum+=d);
  const pool=Array.from({length:256},(_,id)=>{const f=features(id);return{id,f,p:positions(f,refs)};});
  const sr=random(key+'|starts'),starts=[];
  for(let s=0;s<8;s++){const valid=pool.filter(c=>c.p.filter(x=>x===c.p[rules[s]]).length<4&&!starts.includes(c.id));starts.push(valid[Math.floor(sr()*valid.length)].id);}
  return{date,key,id:date+'__'+VERSION+(mode==='moving'?'__moving-v1':''),mode,version:VERSION,analysisVersion:ANALYSIS,refs,rules,durations,boundaries,starts,pool};
 }
 const permutations=[];
 for(let a=0;a<4;a++)for(let b=0;b<4;b++)for(let c=0;c<4;c++)for(let d=0;d<4;d++)if(new Set([a,b,c,d]).size===4)permutations.push([a,b,c,d]);
 const displaced=(a,b)=>a.every((v,i)=>v!==b[i]);
 function layout(c,s,i){
  if(c.mode!=='moving')return [0,1,2,3];
  if(!c.layoutCache){
   const rng=random(c.key+'|moving-v1|anchors'),anchors=[[0,1,2,3]];
   for(let n=1;n<8;n++){const options=permutations.filter(p=>displaced(p,anchors[n-1]));anchors.push(options[Math.floor(rng()*options.length)]);}
   c.layoutCache={anchors,stages:anchors.map(a=>[a])};
  }
  const {anchors,stages}=c.layoutCache,seq=stages[s];
  while(seq.length<=i){
   // Every possible last card in this stage must move fully to the next stage's fixed opening layout.
   const options=permutations.filter(p=>displaced(p,seq[seq.length-1])&&(s===7||displaced(p,anchors[s+1])));
   const rng=random(c.key+'|moving-v1|'+s+'|'+seq.length);seq.push(options[Math.floor(rng()*options.length)]);
  }
  return seq[i].slice();
 }
 function meta(c,s,id){const x=c.pool[id],pos=x.p[c.rules[s]];return{id,pos,m:x.p.filter(p=>p===pos).length,f:x.f,p:x.p};}
 function initialOK(c,s,cards){if(cards.length<3)return true;const first=cards.slice(0,3).map(id=>c.pool[id].p);if(s)return first.some(p=>p[c.rules[s]]!==p[c.rules[s-1]]);for(let a=0;a<4;a++)for(let b=a+1;b<4;b++)if(!first.some(p=>p[a]!==p[b]))return false;return true;}
 function buildBatch(c,s,batch=0,history=[]){
  const target=[0,102,115,39],forbidden=s<7?c.starts[s+1]:-1;
  const options=c.pool.map(x=>meta(c,s,x.id)).filter(x=>x.m<4&&x.id!==forbidden);
  for(let attempt=0;attempt<32;attempt++){
   const rng=random(c.key+'|cards-'+s+'|batch-'+batch+'|attempt-'+attempt);
   const cards=[],mc=[0,0,0,0],pc=[0,0,0,0],fc=Array.from({length:4},()=>[0,0,0,0]);
   const tail=history.slice(-19).map(id=>meta(c,s,id)),seq=tail.slice();let checks=0;
   function candidates(i){
    const left=256-i,prev=seq.slice(-19),recent=seq.slice(-8),five=seq.slice(-4),three=seq.slice(-3);
    const wm=[0,0,0,0],wp=[0,0,0,0],wf=Array.from({length:4},()=>[0,0,0,0]);
    for(const x of prev){wm[x.m]++;wp[x.pos]++;x.f.forEach((v,d)=>wf[d][v]++);}
    const out=[];
    for(const x of options){
     if(batch===0&&i===0&&x.id!==c.starts[s])continue;
     if(mc[x.m]>=target[x.m]||pc[x.pos]>=64||recent.some(y=>y.id===x.id))continue;
     if(three.length===3&&three.every(y=>y.pos===x.pos))continue;
     if(five.length===4&&x.m!==1&&five.every(y=>y.m!==1))continue;
     if(x.f.some((v,d)=>fc[d][v]>=72))continue;
     if(left<56&&fc.some((a,d)=>a.some((n,v)=>n+(x.f[d]===v?1:0)+left-1<56)))continue;
     if(prev.length===19){
      if(wm[1]+(x.m===1)<5||wm[1]+(x.m===1)>11||wm[3]+(x.m===3)>6)continue;
      if(wp.some((n,p)=>n+(x.pos===p)<2||n+(x.pos===p)>8))continue;
      if(wf.some((a,d)=>a.some((n,v)=>n+(x.f[d]===v)<1||n+(x.f[d]===v)>10)))continue;
     }
     if(batch===0&&i===2&&!initialOK(c,s,[...cards,x.id]))continue;
     const imbalance=(mc[x.m]/target[x.m]+pc[x.pos]/64)*20;
     const fscore=x.f.reduce((a,v,d)=>a+fc[d][v],0)*0.1;
     out.push({x,score:rng()*12-imbalance-fscore});
    }
    out.sort((a,b)=>b.score-a.score);return out.map(a=>a.x);
   }
   function visit(i){
    if(i===256)return true;if(checks>200000)return false;
    const list=candidates(i);
    for(const x of list){
     if(++checks>200000)return false;
     cards.push(x.id);seq.push(x);mc[x.m]++;pc[x.pos]++;x.f.forEach((v,d)=>fc[d][v]++);
     if(visit(i+1))return true;
     cards.pop();seq.pop();mc[x.m]--;pc[x.pos]--;x.f.forEach((v,d)=>fc[d][v]--);
    }
    return false;
   }
   if(visit(0))return cards;
  }
  throw new Error('日期 '+c.date+' 的第 '+(s+1)+' 段無法通過建卡條件');
 }
 function validateBatch(c,s,cards,history=[]){
  const errors=[],all=[...history.slice(-19),...cards],offset=all.length-cards.length;
  const mc=[0,0,0,0,0],pc=[0,0,0,0],fc=Array.from({length:4},()=>[0,0,0,0]);
  for(let i=offset;i<all.length;i++){
   const id=all[i],f=features(id),p=positions(f,c.refs),pos=p[c.rules[s]],m=p.filter(v=>v===pos).length;
   mc[m]++;pc[pos]++;f.forEach((v,d)=>fc[d][v]++);
   if(m===4)errors.push('four-match');
   if(s<7&&id===c.starts[s+1])errors.push('boundary-repeat');
   if(all.slice(Math.max(0,i-8),i).includes(id))errors.push('recent-repeat');
   if(i>=3&&all.slice(i-3,i+1).every(k=>positions(features(k),c.refs)[c.rules[s]]===pos))errors.push('position-run');
   if(i>=4&&!all.slice(i-4,i+1).some(k=>{const pp=positions(features(k),c.refs);return pp.filter(v=>v===pp[c.rules[s]]).length===1;}))errors.push('five-no-single');
   if(i>=19){const w=all.slice(i-19,i+1).map(k=>{const ff=features(k),pp=positions(ff,c.refs);return{ff,pp,m:pp.filter(v=>v===pp[c.rules[s]]).length};});
    const single=w.filter(x=>x.m===1).length;if(single<5||single>11||w.filter(x=>x.m===3).length>6)errors.push('window-m');
    for(let v=0;v<4;v++){const n=w.filter(x=>x.pp[c.rules[s]]===v).length;if(n<2||n>8)errors.push('window-position');for(let d=0;d<4;d++){const n=w.filter(x=>x.ff[d]===v).length;if(n<1||n>10)errors.push('window-feature');}}
   }
  }
  if(cards.length!==256||mc[1]!==102||mc[2]!==115||mc[3]!==39)errors.push('quota-m');
  if(pc.some(n=>n!==64)||fc.some(a=>a.some(n=>n<56||n>72)))errors.push('quota-feature');
  if(!history.length&&(cards[0]!==c.starts[s]||!initialOK(c,s,cards)))errors.push('initial');
  return [...new Set(errors)];
 }
 function classify(m,r,e){if(m.includes(r))return'correct';if(!m.length)return'no_match_error';if(m.length===1)return e.includes(m[0])?'single_repeated_error':'single_unexcluded_error';return m.every(d=>e.includes(d))?'all_excluded_error':'ambiguous_error';}
 function opportunity(card,refs,e){return refs.some(ref=>{const m=matched(card,ref);return m.length===1&&e.includes(m[0]);});}

function deal(elapsed){

 if(g.current){g.trials.push({...g.current,result:'unfinished',chosenIndex:null,answeredAtElapsedMs:null,responseTimeMs:null,matchedFeatures:[],errorClass:null,feedbackPresented:false,isOpportunity:false});g.current=null;}
 const completedAt=Date.now(),existing=records.filter(s=>s.challengeId===g.c.id),ordinal=existing.length?Math.max(...existing.map(s=>s.ordinal))+1:1;
 const s={id:g.id,challengeId:g.c.id,date:g.c.date,mode:g.c.mode,durationMs:Core.DURATION,scoring:{...Core.SCORING},version:Core.VERSION,analysisVersion:Core.ANALYSIS,startedAt:g.startedAt,completedAt,ordinal,summary:Core.summarize(g.trials),trials:g.trials,refs:g.c.refs,rules:g.c.rules,durations:g.c.durations,boundaries:g.c.boundaries,priorInterruptedAttempts:attempts.filter(a=>a.challengeId===g.c.id&&a.status==='interrupted').length};
 let saved=false;
 if(db)try{
  const t=db.transaction(['sessions','attempts'],'readwrite'),done=txDone(t),store=t.objectStore('sessions');const all=await req(store.getAll());
  const writes=Core.prepareSave(all,memoryRecords,s,Date.now()-7*86400000);
  for(const item of writes){store.put(item);t.objectStore('attempts').put({id:item.id,challengeId:item.challengeId,startedAt:item.startedAt,status:'completed',endedAt:item.completedAt});}
  await done;Object.assign(s,writes.find(x=>x.id===s.id));const ids=new Set(writes.map(x=>x.id));memoryRecords=memoryRecords.filter(x=>!ids.has(x.id));saved=true;storageWarning='';
 }catch{storageWarning='本次結果未能保存，請在離開前查看。';}
 if(!saved){s.saved=false;memoryRecords.push(s);records=Core.mergeSessions(records,memoryRecords,Date.now()-7*86400000);storageWarning=storageWarning||'本次結果只保留於此頁面，關閉後可能消失。';}else await refreshRecords();
 unmark(g.id);g.result=s;resultView(s,saved);
}
function interrupt(reason){
 const g=game;if(!g||g.status!=='active')return;g.status='interrupted';cancelAnimationFrame(frameHandle);feedbackTimers.forEach(clearTimeout);
 const a={...g.attempt,status:'interrupted',reason,endedAt:Date.now()};markActive(a);attempts=[a,...attempts.filter(x=>x.id!==a.id)];
 putAttempt(a).then(()=>{if(db)unmark(a.id);}).catch(()=>{});
 setScreen('interrupted',header()+`<div class="empty"><div class="interrupt-icon" aria-hidden="true">Ⅱ</div><p class="eyebrow">CHALLENGE INTERRUPTED</p><h2>這一局已中斷</h2><p>${esc(reason)}。為保持完整的三分鐘體驗，<br>請重新開始挑戰。</p><p class="tiny">不計入完成紀錄，也不占用首次完成。<br>重新開始會使用今日的同一套題目。</p><div class="actions" style="justify-content:center"><button class="primary" id="restart">開始今日挑戰</button><button class="secondary" id="back">返回首頁</button></div></div>`);
 $('restart').onclick=start;$('back').onclick=home;
}
function resultView(s,saved=true){
 selectedMode=s.mode==='moving'?'moving':'fixed';
 const minutes=(s.durationMs||s.durations.reduce((sum,t)=>sum+t,0))/60000,penalty=s.scoring?.error??0;
 const a=s.summary,old=s.date!==Core.dateKey(),legacy=s.version!==Core.VERSION,counts=a.classes;
 const rows=Array.from({length:8},(_,i)=>{const ts=s.trials.filter(t=>t.segmentId===i),x=Core.summarize(ts);return `<tr><td>${i+1}</td><td>${Core.NAMES[s.rules[i]]}</td><td>${x.correct}</td><td>${x.error}</td><td>${x.timeout}</td><td>${rt(x.medianRT)}</td></tr>`;}).join('');
 const details=s.trials.map(t=>{const values=[colorNames[t.features[0]],shapes[t.features[1]],t.features[2]+1,borders[t.features[3]]].join('／');const label={correct:'正確',error:'錯誤',timeout:'逾時',unfinished:'終場未完成'}[t.result];return `<tr><td>${t.trialId}</td><td>${t.segmentId+1}</td><td>${(t.shownAtElapsedMs/1000).toFixed(2)} 秒</td><td>${Core.NAMES[t.activeRule]}</td><td>${values}</td><td>${t.chosenIndex===null?'—':t.chosenIndex+1}</td><td>${t.correctIndex+1}</td><td>${label}</td><td>${rt(t.responseTimeMs)}</td><td>${t.matchedFeatures.map(d=>Core.NAMES[d]).join('、')||'—'}</td><td>${t.excludedBefore.map(d=>Core.NAMES[d]).join('、')||'—'}</td><td>${Core.ERROR_NAMES[t.errorClass]||'—'}</td><td>${(t.referenceOrder||[0,1,2,3]).map(id=>{const f=s.refs[id];return [colorNames[f[0]],shapes[f[1]],f[2]+1,borders[f[3]]].join('/');}).join(' → ')}</td></tr>`;}).join('');
 setScreen('result',header(s.date+' · '+modeName(s.mode)+' · 本局結果')+notice()+`<section class="result-head"><p class="eyebrow">YOUR SESSION, IN REVIEW</p><span class="badge">${s.ordinal===1?'首次完成':'第 '+s.ordinal+' 次完成 · 重玩'}</span><h1>${minutes===3?'三':minutes===5?'五':minutes}分鐘，每一步都有線索。</h1><div class="big-score">${fmt(a.score)}</div><p class="tiny">${s.date} 的挑戰 · ${a.correct} 題答對 × 100 分${penalty?' − '+a.error+' 題答錯 × '+Math.abs(penalty)+' 分':''}<br>${saved?'已儲存在此瀏覽器，保留七天。':'尚未保存至本機。'}${s.priorInterruptedAttempts?'<br>此局之前有 '+s.priorInterruptedAttempts+' 次未完成嘗試。':''}</p></section><div class="metrics"><div class="metric"><strong>${pct(a.accuracy)}</strong><span>正確率</span><small>不含逾時</small></div><div class="metric"><strong>${a.correct} / ${a.error}</strong><span>答對 / 答錯</span></div><div class="metric"><strong>${a.timeout}</strong><span>逾時</span></div><div class="metric"><strong>${rt(a.medianRT)}</strong><span>典型答題時間</span><small>以中位數計算</small></div></div><p class="tiny">${a.unfinished?'最後一張未完成，不計為錯誤或逾時。':''}</p><div class="actions result-actions"><button class="primary" id="again">${old?'開始今日挑戰':legacy?'開始目前版本挑戰':'再挑戰一次'}</button><button class="secondary" id="back">返回首頁</button></div>${old?'<p class="tiny" style="text-align:center">此局已跨午夜，保留原挑戰成績；昨日題目不再開放重玩。</p>':''}<details class="details-panel" open><summary>本局行為回顧</summary><div class="details-content"><p class="tiny">此測驗僅提供真實回饋關係，僅供玩家參考。</p>${Core.reviewGroups(counts).map(g=>`<div class="analysis-row"><span>${g.name}</span><strong>${g.count} 次</strong></div><p class="tiny analysis-description">${g.description}</p><div class="track"><div style="width:${a.error?g.count/a.error*100:0}%"></div></div>`).join('')}<p class="tiny">遊玩中規則再次變動、誤觸或尚未注意回饋，都可能影響紀錄。</p></div></details><details class="details-panel"><summary>各階段表現</summary><div class="details-content"><div class="scroll-table"><table><thead><tr><th>區段</th><th>規則</th><th>正確</th><th>錯誤</th><th>逾時</th><th>典型答題時間</th></tr></thead><tbody>${rows}</tbody></table></div></div></details><details class="details-panel"><summary>逐題紀錄（${s.trials.length} 張）</summary><div class="details-content"><div class="scroll-table"><table><thead><tr><th>題次</th><th>區段</th><th>發牌時間</th><th>規則</th><th>卡片特徵</th><th>選擇</th><th>正解</th><th>結果</th><th>反應時間</th><th>匹配特徵</th><th>先前否定</th><th>分類</th><th>當題參考卡（位置 1–4）</th></tr></thead><tbody>${details}</tbody></table></div></div></details>`+footer());
 $('again').onclick=start;$('back').onclick=home;
}
async function historyView(){
 await refreshRecords();const groups=[...new Set(records.map(s=>s.challengeId))];
 setScreen('history',header()+notice()+`<p class="eyebrow">YOUR LOCAL RECORDS</p><h1 style="font-size:36px">最近七天的足跡</h1><p class="intro">首次完成與重玩，各自留下紀錄。<br>資料只存在這個瀏覽器，不會上傳。</p><div class="actions" style="margin-bottom:24px"><button class="secondary" id="back">返回首頁</button>${records.length?'<button class="textbtn danger" id="clear">清除所有本機紀錄</button>':''}</div>${groups.length?groups.map(key=>{const group=records.filter(s=>s.challengeId===key).sort((a,b)=>a.ordinal-b.ordinal),first=group.find(s=>s.ordinal===1),replay=group.filter(s=>s.ordinal>1),best=replay.length?Math.max(...replay.map(s=>s.summary.score)):null;return `<section class="panel"><h3>${esc(group[0].date)} · ${modeName(group[0].mode)} <span class="tiny">${group[0].version===Core.VERSION?'目前題目':'舊版題目'}</span></h3><p class="tiny">首次完成 ${first?fmt(first.summary.score):'—'} 分 · 重玩最佳 ${best===null?'—':fmt(best)} 分</p>${group.map(s=>`<div class="history-item"><div><strong>${s.ordinal===1?'首次完成':'重玩 · 第 '+s.ordinal+' 次完成'}</strong><small>${esc(new Date(s.completedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}))}</small></div><span class="history-score">${fmt(s.summary.score)}</span><button class="secondary view-record" data-id="${esc(s.id)}">查看結果</button></div>`).join('')}</section>`;}).join(''):'<div class="panel empty">還沒有完成紀錄。<br>給自己三分鐘，留下第一個成績。</div>'}`+footer());
 $('back').onclick=home;document.querySelectorAll('.view-record').forEach(b=>b.onclick=()=>{const s=records.find(s=>s.id===b.dataset.id);resultView(s,s.saved!==false);});if($('clear'))$('clear').onclick=confirmClear;
}
function confirmClear(){
 const dialog=document.createElement('dialog');dialog.innerHTML='<h2>清除本機紀錄？</h2><p class="tiny">所有完成分數、逐題紀錄、首次完成狀態與中斷次數都會刪除，無法復原。</p><div class="actions"><button class="primary" id="confirm-clear">確認清除</button><button class="secondary" id="cancel-clear">取消</button></div>';document.body.append(dialog);dialog.showModal();dialog.onclose=()=>dialog.remove();$('cancel-clear').onclick=()=>dialog.close();$('confirm-clear').onclick=async()=>{try{if(db){const t=db.transaction(['sessions','attempts'],'readwrite');t.objectStore('sessions').clear();t.objectStore('attempts').clear();await txDone(t);}const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(prefix+'active:'))keys.push(k);}keys.forEach(k=>localStorage.removeItem(k));records=[];memoryRecords=[];attempts=[];dialog.close();historyView();}catch{dialog.close();storageWarning='清除未完成，請使用瀏覽器的網站資料設定檢查。';historyView();}};
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='game')interrupt('切換分頁、離開 App 或鎖屏');else if(!document.hidden)checkDate();});
window.addEventListener('pagehide',()=>{if(screen==='game')interrupt('離開或重新整理頁面');});
function checkDate(){const date=Core.dateKey();if(lastDate!==date){lastDate=date;if(screen==='home')home();if(screen==='result'&&$('again'))$('again').textContent='開始今日挑戰';}}
setInterval(checkDate,15000);
(async()=>{setScreen('loading',header()+'<div class="loading"><p class="tiny">正在讀取本機紀錄…</p></div>');await openDB();await recover();home();})();
})();
</script>
